<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEMAX HD - Movie Requests</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">CINEMAX <span>HD</span></h1>
            <p class="subtitle">Official Movie Request Center</p>
        </header>

        <!-- Movie Request Form -->
        <section class="form-section">
            <form id="movieRequestForm">
                <div class="form-group">
                    <label>Movie Name / චිත්‍රපටයේ නම:</label>
                    <input type="text" id="movieName" placeholder="Ex: Avatar: The Way of Water" required>
                </div>
                <div class="form-group">
                    <label>Language / භාෂාව:</label>
                    <select id="language">
                        <option>Sinhala (Sub/Dub)</option>
                        <option>English</option>
                        <option>Hindi</option>
                        <option>Tamil</option>
                        <option>Other</option>
                    </select>
                </div>
                <button type="submit" class="btn-glow">SEND REQUEST 🎬</button>
            </form>
        </section>

        <!-- Live Wall -->
        <section class="wall-section">
            <h2 class="section-title">📊 Recent Requests (Live Wall)</h2>
            <div class="wall-wrapper">
                <ul id="liveRequests" style="list-style:none; padding:10px; margin:0;"></ul>
            </div>
            <p class="info-text">*නව රික්වෙස්ට් පෙනීමට විනාඩි කිහිපයකි.</p>
        </section>

        <!-- Groups -->
        <section class="group-section">
            <h2 class="section-title">📍 Join Our Categories</h2>
            <div class="group-card">
                <div class="group-info">
                    <span class="category">Movie Only 🎬</span>
                    <span class="title">Community Link</span>
                </div>
                <a href="#" class="join-btn">JOIN US</a>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <p>© 2025 CINEMAX HD. All Rights Reserved.</p>
        </footer>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html></html>
